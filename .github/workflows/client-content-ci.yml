name: Client content publishing checks

on:
  push:
    branches:
      - feature/client-content-publishing-60day
  pull_request:
    branches:
      - appjet

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API and integration tests
        run: npm test
      - name: Build production frontend
        run: npm run build
