name: CI

on:
  push:
    branches:
      - appjet
      - prep/launch-readiness
  pull_request:
    branches:
      - appjet

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find server tests scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check CSS class usage
        run: node scripts/check-classes.js

      - name: Run API tests
        run: npm test

      - name: Build production frontend
        run: npm run build
